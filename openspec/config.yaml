schema: spec-driven

context: |
  - CN105 is read-only. The heat pump is never written to.
  - wM-Bus receives only the project's own meters, never a wildcard.

rules:
  specs:
    - A change that touches CN105 or wM-Bus has a requirement with a
      scenario for that limit.
  design:
    - Every device fact (register, address, data type, scaling) names its
      source and page.
  tasks:
    - The happy-path test comes first, then tests around it.
    - Every test traces to a scenario in the specs.
    - The CN105 and wM-Bus limits each have a test that runs, not only a
      requirement.
    - Every device fact (register, address, data type, scaling) names its
      source and page.

operations:
  apply:
    guidance:
      - Run `npm run typecheck` and `npm test` before marking a task
        complete. Leave the task unchecked while either fails.
      - When the implementation contradicts a spec or design.md, stop and
        update the artifact first.
  archive:
    guidance:
      - Archive on the feature branch before the PR merges.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
